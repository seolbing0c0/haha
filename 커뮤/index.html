<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>._.</title>
<style>
  #container {
    position: relative;
    width: 400px;
  }

  #mainImg {
    width: 100%;
    outline: 4px solid #4a90ff;
    outline-offset: -4px;
    transition: 0.2s;
  }

  .area {
    position: absolute;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="container">
  <img id="mainImg" src="img/기본.png">

  <!-- 눈 -->
  <div class="area" style="top:120px; left:120px; width:80px; height:40px;"
       onclick="changeImg('img/감음.png')"></div>

  <!-- 귀 -->
  <div class="area" style="top:130px; left:260px; width:60px; height:80px;"
       onclick="changeImg('img/당황.png')"></div>

  <!-- 뺨 -->
  <div class="area" style="top:160px; left:140px; width:80px; height:60px;"
       onclick="changeImg('img/혐오.png')"></div>

  <!-- 머리 -->
  <div class="area" style="top:20px; left:100px; width:200px; height:120px;"
       onclick="touchHead()"></div>

  <!-- 몸 -->
  <div class="area" style="top:250px; left:80px; width:250px; height:200px;"
       onclick="changeImg('img/혐오.png')"></div>
</div>

<script>
const defaultImg = "img/기본.png";
let timeoutId;

// ===== 머리 카운트 =====
let headCount = 0;
const level1 = 10;
const level2 = 15;
let isCooling = false;
const cooldownTime = 1000;

// ===== 머리 클릭 =====
function touchHead() {
  if (isCooling) return;

  headCount++;

  if (headCount >= level2) {
    changeImg("img/부끄2.png", true); // 👉 최종 단계
    triggerCooldown();
    headCount = 0;
  } else if (headCount >= level1) {
    changeImg("img/부끄1.png");
  } else {
    changeImg("img/당황.png");
  }
}

// ===== 쿨타임 =====
function triggerCooldown() {
  isCooling = true;

  setTimeout(() => {
    isCooling = false;
  }, cooldownTime);
}

// ===== 이미지 변경 =====
function changeImg(src, isFinal = false) {
  const img = document.getElementById("mainImg");
  img.src = src;

  clearTimeout(timeoutId);

  if (isFinal) {
    // 👉 부끄2: 2.5초 유지 후 순차 복귀
    timeoutId = setTimeout(() => {
      img.src = "img/부끄1.png";

      timeoutId = setTimeout(() => {
        img.src = "img/당황.png";

        timeoutId = setTimeout(() => {
          img.src = defaultImg;
        }, 500);

      }, 500);

    }, 2500);

  } else {
    // 👉 일반 상태
    timeoutId = setTimeout(() => {
      img.src = "img/당황.png";

      timeoutId = setTimeout(() => {
        img.src = defaultImg;
      }, 500);

    }, 500);
  }
}
</script>

</body>
</html>
